abstract: Cyber threat intelligence (CTI) analysts routinely convert noisy, unstructured
  security artifacts into standardized, automation-ready representations. Although
  large language models (LLMs) show promise for this task, existing approaches remain
  brittle when producing structured CTI outputs and have largely relied on supervised
  fine-tuning (SFT). In contrast, CTI standards and community-maintained resources
  define canonical identifiers and schemas that enable deterministic verification
  of model outputs. We leverage this structure to study reinforcement learning with
  verifiable rewards (RLVR) for CTI tasks. We introduce Minerva, a unified dataset
  and training pipeline spanning multiple CTI subtasks, each paired with task-specific
  verifiers that score structured outputs and identifier predictions. To address reward
  sparsity during rollout, we propose MinervaRL, an auxiliary self-training mechanism
  that generates additional verified trajectories and distills them back into the
  model. Averaged across four backbones and 12 CTI benchmarks, MinervaRL improves
  the mean score by 15.8 percentage points over the corresponding base models and
  by 4.3 points over GRPO.
summary: 'From public security knowledge to verifiable learning signals: Minerva trains
  open-weight language models for structured cyber threat intelligence.'
