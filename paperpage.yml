citation:
  bibtex: |
    @article{alam2026minerva,
      title = {Minerva: Reinforcement Learning with Verifiable Rewards for Cyber Threat Intelligence LLMs},
      author = {Alam, Md Tanvirul and Piplai, Aritran and Cardei, Ionut and Rastogi, Nidhi and Worth, Jr., Peter J},
      journal = {Transactions on Machine Learning Research},
      year = {2026},
      url = {https://openreview.net/forum?id=w1IMu9exKC}
    }
instructions: |
  Preserve the five approved authors in their paper order. Present TMLR acceptance
  and use the Athena-Software-Group/minerva repository for every code CTA. Distinguish
  training tasks from evaluation benchmarks. Report percentage-point changes,
  fixed-checkpoint bootstrap uncertainty, and heterogeneous task-level outcomes.
  Keep the page static, accessible, responsive, and free of analytics or credentials.
