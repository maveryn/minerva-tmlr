  venue_line: Accepted at TMLR · 2026
  canonical_url: https://maveryn.github.io/minerva-tmlr/
  description: Minerva trains open-weight language models for cyber threat intelligence with verifiable rewards and auxiliary self-training.
  cta_links:
    - {label: Read the paper, key: paper_pdf}
    - {label: Code, key: code}
